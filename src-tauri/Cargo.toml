[package]
name = "cloakbrowser-local-manager"
version = "0.1.0"
description = "Local Windows profile manager for CloakBrowser"
authors = ["CyberCloak"]
edition = "2021"

[package.metadata.tauri-winres]
FileDescription = "CyberCloak"
ProductName = "CyberCloak"
ProductVersion = "0.1.0"
OriginalFilename = "cybercloak.exe"
LegalCopyright = "Copyright (c) 2026 CyberCloak"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4", "serde"] }
